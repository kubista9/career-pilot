name: No user data

# Blocks private data from reaching the repository. It fails when a file that
# looks like a profile, CV, tracker, token or application is tracked, when a
# file contains a phone number, an email, a home folder path or a real-looking
# id, or when a secret scanner finds a credential. Matched values are never
# printed, only the file and line.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  private-files-and-values:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --locked
      - name: Private files and values
        run: uv run career-pilot setup-check --repo-only

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The image is run directly, not through gitleaks-action: the action cannot scan the
      # first push of a repository (it looks for the parent of the root commit).
      - name: Scan the whole history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose
